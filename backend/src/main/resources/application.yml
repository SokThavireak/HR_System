server:
  port: 8081

spring:
  datasource:

    url: ${SPRING_DATASOURCE_URL:${NEON_DATABASE_URL:jdbc:postgresql://${NEON_DB_HOST:localhost}:${NEON_DB_PORT:5432}/${NEON_DB_NAME:hr_system}${NEON_DB_PARAMS:}}}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:${NEON_DB_USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${NEON_DB_PASSWORD:051126}}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: "yyyy-MM-dd'T'HH:mm:ss"

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.web.cors: DEBUG

app:
  jwt:
    secret: hrms-demo-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm-ok
    expiration: 86400000   # 24 hours
